[project]
name = "lidar-analysis-platform"
version = "0.1.0"
description = "LiDAR Performance Analysis & Simulation Platform (SilvaLab / UF)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
    "pypdf>=6.18.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
